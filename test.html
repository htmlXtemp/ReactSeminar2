<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body class="light">
    <div>
        <button id="test">Сменить тему</button>
        <p>
            <h1>Поступление в Хогвартс</h1>
        </p>
    <div class="form">
            Имя:
            <form>
                <input type="text" name="Имя"/>
            </form>
        <p>Факультет:</p>
            <select name="faculty">
                <option value="FCS">ФКН</option>
                <option value="FDN">ФДН</option>
                <option value="DRIP">ДРИП</option>
            </select>
        <p>
            Волшебная палочка:
            <form>
                <input type="text" name="Волшебная палочка"/>
            </form>
        </p>
        <p>
        <button>Отправить сову</button>
        </p>
    </div>
    </div>
    <script>
        const body = document.body;
        document.getElementById("test").onclick = () => {
            body.classList.toggle("dark");
            body.classList.toggle("light");
        }
    </script>
</body>
</html>
